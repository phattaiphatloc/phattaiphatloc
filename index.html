<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Phát Tài Phát</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				font-family: Arial, sans-serif;
				background: #f7f7f7;
				color: #222;
			}
			.card {
				background: white;
				padding: 48px 40px;
				border-radius: 16px;
				box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
				text-align: center;
				max-width: 560px;
				margin: 20px;
			}
			h1 {
				margin: 0 0 12px;
				font-size: 42px;
			}
			p {
				margin: 0;
				font-size: 20px;
				color: #555;
			}
		</style>
	</head>
	<body>
		<main class="card">
			<h1>PHÁT TÀI PHÁT LỘC</h1>
			<p>Website đang hoạt động 🎉</p>
		</main>
	</body>
</html>
